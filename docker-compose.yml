name: dns-manager

services:
    backend:
        container_name: dns-manager-backend
        build:
            context: ./backend
            dockerfile: ./docker/Dockerfile
        env_file:
            - .env
        ports:
            - "${API_PORT-9000}:8000"
        networks:
            - dnsnet
    frontend:
        container_name: dns-manager-frontend
        build:
            context: ./webapp
            dockerfile: ./docker/Dockerfile
        environment:
            - VITE_HTTPS_ENABLED=${HTTPS_ENABLED:-FALSE}
            - VITE_API_PORT=${API_PORT:-9000}
        ports:
            - "${FRONTEND_PORT-3000}:3000"
        networks:
            - dnsnet
networks:
    dnsnet:
        external: true
        name: dnsnet
