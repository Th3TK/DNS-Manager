[project]
name = "http-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt==4.0.1",
    "dnspython>=2.8.0",
    "fastapi-pagination>=0.15.16",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "icmplib>=3.0.4",
    "passlib>=1.7.4",
    "psycopg[binary]>=3.3.4",
    "pyjwt>=2.13.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
