name: dns-manager-dev

services:
    backend:
        container_name: dns-manager-backend-dev
        build:
            context: ./backend
            dockerfile: ./docker/Dockerfile.dev
        volumes:
            - ./backend/app:/backend/app
            - ./backend/migrations:/backend/migrations
        env_file:
            - .env
        ports:
            - "${API_PORT-9000}:8000"
        networks:
            - dnsnet
    frontend:
        container_name: dns-manager-frontend-dev
        build:
            context: ./webapp
            dockerfile: ./docker/Dockerfile.dev
        volumes:
            - ./webapp:/webapp
            - /webapp/node_modules
        environment:
            - VITE_HTTPS_ENABLED=${HTTPS_ENABLED:-FALSE}
            - VITE_API_PORT=${API_PORT:-9000}
        ports:
            - "${FRONTEND_PORT-3000}:5173"
        networks:
            - dnsnet
    watcher:
        container_name: dns-manager-docker-watcher-dev
        build:
            context: ./watcher
            dockerfile: ./docker/Dockerfile.dev
        restart: unless-stopped
        environment:
            - API_PORT=8000
            - API_HOST=dns-manager-backend-dev
            - HTTPS_ENABLED=${HTTPS_ENABLED:-FALSE}
            - WATCHER_NAME=${WATCHER_NAME}
            - TRAEFIK_HOST_IP=${TRAEFIK_HOST_IP}
            - WATCHER_AUTHENTICATION_SECRET_KEY=${WATCHER_AUTHENTICATION_SECRET_KEY}
            - LOG_LEVEL=${LOG_LEVEL:-INFO}
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ./watcher/src:/watcher/src
        networks:
            - dnsnet
networks:
    dnsnet:
        external: true
        name: dnsnet
